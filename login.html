<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Scentora</title>

    <link rel="stylesheet" href="css/auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <div class="background-overlay"></div>

    <header class="top-header">
        <a href="index.html" class="brand">
            <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
                <path d="M32 53 C17 45 12 31 17 17 C29 19 37 28 32 53Z"
                      fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M32 53 C47 45 52 31 47 17 C35 19 27 28 32 53Z"
                      fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M32 53 L32 13" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M22 37 L32 45 L42 37" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>

            <span class="brand-text">
                <strong>scentora<span>.</span></strong>
                <small>THE ART OF FRAGRANCE</small>
            </span>
        </a>

        <p class="header-tagline">Craft your signature scent <span></span></p>
    </header>

    <main class="login-main">

        <div class="petal petal-one">✧</div>
        <div class="petal petal-two">✦</div>
        <div class="petal petal-three">✧</div>
        <div class="petal petal-four">✦</div>

        <section class="login-card">

            <div class="card-logo">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M32 53 C17 45 12 31 17 17 C29 19 37 28 32 53Z"
                          fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M32 53 C47 45 52 31 47 17 C35 19 27 28 32 53Z"
                          fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M32 53 L32 13" fill="none" stroke="currentColor" stroke-width="1.8"/>
                </svg>
            </div>

            <h1>Welcome</h1>
            <p class="card-subtitle">Log in to continue your fragrance journey</p>

            <form id="loginForm" novalidate>

                <div class="input-field">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="5" width="17" height="14" rx="2"/>
                            <path d="M4 7L12 13L20 7"/>
                        </svg>
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-field password-field">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            <circle cx="12" cy="15" r="1.2"/>
                            <path d="M12 16.2V18"/>
                        </svg>
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="button" class="show-password" id="togglePassword" aria-label="Show password">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12S5.5 5.5 12 5.5S22 12 22 12S18.5 18.5 12 18.5S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="login-button" id="loginButton">
                    <span>Log In</span>
                    <span class="arrow">→</span>
                </button>

                <p class="login-message" id="loginMessage" aria-live="polite"></p>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="register.html">Sign Up</a>
            </p>

        </section>
    </main>

    <footer class="page-footer">
        <span>SCENTORA</span> &nbsp;·&nbsp; YOUR SIGNATURE, YOUR STORY
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
