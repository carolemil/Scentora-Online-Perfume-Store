
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Scentora</title>

    <link rel="stylesheet" href="css/auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <div class="background-overlay"></div>

    <header class="top-header">
        <a href="index.html" class="brand">
            <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
                <path d="M32 53 C17 45 12 31 17 17 C29 19 37 28 32 53Z"
                      fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M32 53 C47 45 52 31 47 17 C35 19 27 28 32 53Z"
                      fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M32 53 L32 13" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M22 37 L32 45 L42 37" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>

            <span class="brand-text">
                <strong>scentora<span>.</span></strong>
                <small>THE ART OF FRAGRANCE</small>
            </span>
        </a>

        <p class="header-tagline">Craft your signature scent <span></span></p>
    </header>

    <main class="login-main">

        <div class="petal petal-one">✧</div>
        <div class="petal petal-two">✦</div>
        <div class="petal petal-three">✧</div>
        <div class="petal petal-four">✦</div>

        <section class="login-card">

            <div class="card-logo">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M32 53 C17 45 12 31 17 17 C29 19 37 28 32 53Z"
                          fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M32 53 C47 45 52 31 47 17 C35 19 27 28 32 53Z"
                          fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M32 53 L32 13" fill="none" stroke="currentColor" stroke-width="1.8"/>
                </svg>
            </div>

            <h1>Welcome</h1>
            <p class="card-subtitle">Log in to continue your fragrance journey</p>

            <form id="loginForm" novalidate>

                <div class="input-field">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="5" width="17" height="14" rx="2"/>
                            <path d="M4 7L12 13L20 7"/>
                        </svg>
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        required
                    >
                </div>
                <small class="field-error" id="emailError"></small>

                <div class="input-field password-field">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            <circle cx="12" cy="15" r="1.2"/>
                            <path d="M12 16.2V18"/>
                        </svg>
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="button" class="show-password" id="togglePassword" aria-label="Show password">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12S5.5 5.5 12 5.5S22 12 22 12S18.5 18.5 12 18.5S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <small class="field-error" id="passwordError"></small>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox"></span>
                        Remember Me
                    </label>

                    <button type="button" class="forgot-link" id="forgotPassword">
                        Forgot Password?
                    </button>
                </div>

                <button type="submit" class="login-button" id="loginButton">
                    <span>Log In</span>
                    <span class="arrow">→</span>
                </button>

                <p class="login-message" id="loginMessage" aria-live="polite"></p>

            </form>

            <div class="or-divider">
                <span></span>
                <small>OR</small>
                <span></span>
            </div>

            

            <div class="social-buttons">

                <button type="button" class="social-button" id="googleLogin">
                    <svg class="google-logo" viewBox="0 0 48 48" aria-label="Google logo">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.98 46.98 31.9 46.98 24.55z"/>
                        <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
            
                <button type="button" class="social-button" id="appleLogin">
                    <svg class="apple-logo" viewBox="0 0 384 512" aria-label="Apple logo">
                        <path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.8-44.6-35.6-2.8-74.5 20.8-88.9 20.8-15.2 0-49.6-19.8-76.7-19.8C62.4 141.3 0 184.8 0 273.1c0 26.1 4.8 53.1 14.4 80.9 12.8 36.7 59 126.6 107.2 125.1 25.2-.6 43-17.9 75.9-17.9 31.9 0 48.4 17.9 76.5 17.9 48.6-.7 90.4-82.4 102.6-119.2-65.2-30.7-58-89.4-58-91.2zM262.5 104.7c27.3-32.4 24.8-62.1 24-72.7-24.1 1.4-51.9 16.4-67.8 35-17.5 19.8-27.8 44.2-25.6 71.8 26.1 2 49.9-11.4 69.4-34.1z"/>
                    </svg>
                    <span>Continue with Apple</span>
                </button>
            
            </div>
            

    

</div>

            </div>

            <p class="signup-text">
                Don't have an account?
                <a href="register.html">Sign Up</a>
            </p>

        </section>
    </main>

    <footer class="page-footer">
        <span>SCENTORA</span> &nbsp;·&nbsp; YOUR SIGNATURE, YOUR STORY
    </footer>

    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgotModal" aria-hidden="true">
        <div class="modal-card">
            <button type="button" class="modal-close" id="closeModal" aria-label="Close">×</button>

            <div class="modal-icon">✧</div>
            <h2>Forgot Password?</h2>
            <p>Enter your email address to start the account recovery process.</p>

            <form id="forgotForm" novalidate>
                <input type="email" id="recoveryEmail" placeholder="Email Address" required>
                <small class="field-error" id="recoveryError"></small>

                <button type="submit" class="login-button">
                    Continue <span class="arrow">→</span>
                </button>

                <p class="login-message" id="recoveryMessage" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
