<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Offers & Promo Codes | Scentora Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css">
  <style>
    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .offer-card {
      background: #FFFDF9;
      border: 1px solid #E8DED1;
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 4px 14px rgba(73, 55, 44, 0.05);
    }
    .offer-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .offer-code-tag {
      font-family: 'DM Sans', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #49372C;
      background: #F4EDE2;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px dashed #AD8754;
    }
    .offer-discount-pill {
      background: #75563F;
      color: #FFF;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .offer-desc {
      color: #6E5D50;
      font-size: 14px;
      line-height: 1.5;
    }
    .offer-card-actions {
      display: flex;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #EFE6DA;
    }
    .offer-card-actions button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #D8C7B4;
      background: transparent;
      color: #49372C;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.2s;
    }
    .offer-card-actions button:hover {
      background: #75563F;
      color: #FFF;
      border-color: #75563F;
    }
    .offer-card-actions button.btn-del:hover {
      background: #A44E42;
      border-color: #A44E42;
      color: #FFF;
    }
  </style>
</head>
<body>

  <!-- Security Check -->
  <script>
    if (sessionStorage.getItem("scentoraAdminLoggedIn") !== "true") {
      window.location.href = "admin-login.html";
    }
  </script>

  <!-- Navigation -->
  <header class="navbar">
    <a href="admin.html" class="brand">
      <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M67 23C57 12 38 15 32 28C26 41 39 48 52 50C67 52 76 62 68 76C60 90 39 88 30 76"/>
          <g transform="translate(39 20)">
            <ellipse cy="-8" rx="4.5" ry="7"/>
            <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(72)"/>
            <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(144)"/>
            <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(216)"/>
            <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(288)"/>
            <circle r="2.3" fill="#AD8754" stroke="none"/>
          </g>
          <g transform="translate(69 77)">
            <ellipse cy="-7" rx="4" ry="6"/>
            <ellipse cy="-7" rx="4" ry="6" transform="rotate(72)"/>
            <ellipse cy="-7" rx="4" ry="6" transform="rotate(144)"/>
            <ellipse cy="-7" rx="4" ry="6" transform="rotate(216)"/>
            <ellipse cy="-7" rx="4" ry="6" transform="rotate(288)"/>
            <circle r="2" fill="#AD8754" stroke="none"/>
          </g>
        </g>
      </svg>
      <span class="brand-name">scentora<span>.</span></span>
    </a>

    <div class="nav-actions">
      <a href="admin.html" class="secondary-button">← Back to Dashboard</a>
      <a href="shop.html" class="nav-button">View Storefront</a>
    </div>
  </header>

  <!-- Page Banner -->
  <section class="page-banner">
    <p class="eyebrow">PROMOTIONS & DISCOUNTS</p>
    <h1>Active <span>Offers</span></h1>
    <p class="banner-sub">All promo codes here sync directly with Scentora checkout and storefront banners.</p>
  </section>

  <main class="admin-container">
    <!-- Left Panel: Add / Edit Offer -->
    <section class="panel">
      <h2 id="offer-form-title">Create New Promo Code</h2>
      <form id="manage-offer-form">
        <input type="hidden" id="offer-edit-index" value="-1">
        <input type="text" id="manage-offer-code" placeholder="Promo Code (e.g. SCENT20)" required>
        <input type="number" id="manage-offer-discount" placeholder="Discount Percentage (e.g. 20)" min="1" max="90" required>
        <input type="text" id="manage-offer-desc" placeholder="Short Description (e.g. Selected Fragrances)">
        <div class="form-buttons">
          <button type="submit" id="save-offer-btn" class="nav-button">Save Offer</button>
          <button type="button" id="cancel-offer-edit" class="secondary-button" style="display:none;">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Right Panel: Active Promo Codes Cards -->
    <section class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Active Promo Codes (<span id="offers-page-count">0</span>)</h2>
      </div>
      <div id="offers-cards-container" class="offers-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Store Administration Portal</p>
    <p class="copyright" style="margin-top: 20px;">© 2026 Scentora. All rights reserved.</p>
  </footer>

  <script>
    const defaultOffers = [
      { code: "SCENT15", discount: 15, desc: "Welcome 15% Off" },
      { code: "LUXURY25", discount: 25, desc: "Selected Fragrances Special" }
    ];

    let offers = JSON.parse(localStorage.getItem("scentora_offers")) || [...defaultOffers];

    function renderOfferCards() {
      const container = document.getElementById("offers-cards-container");
      const countEl = document.getElementById("offers-page-count");
      countEl.textContent = offers.length;
      container.innerHTML = "";

      if (offers.length === 0) {
        container.innerHTML = `<p style="color:#75563F;">No active promo codes yet. Create one on the left.</p>`;
        return;
      }

      offers.forEach((offer, index) => {
        const card = document.createElement("div");
        card.className = "offer-card";
        card.innerHTML = `
          <div>
            <div class="offer-card-top">
              <span class="offer-code-tag">${offer.code}</span>
              <span class="offer-discount-pill">${offer.discount}% OFF</span>
            </div>
            <p class="offer-desc" style="margin-top: 12px;">${offer.desc || "Storewide Promotional Offer"}</p>
          </div>
          <div class="offer-card-actions">
            <button type="button" onclick="editOffer(${index})">Edit</button>
            <button type="button" class="btn-del" onclick="removeOffer(${index})">Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function editOffer(index) {
      const offer = offers[index];
      document.getElementById("offer-edit-index").value = index;
      document.getElementById("manage-offer-code").value = offer.code;
      document.getElementById("manage-offer-discount").value = offer.discount;
      document.getElementById("manage-offer-desc").value = offer.desc || "";
      document.getElementById("offer-form-title").textContent = "Edit Promo Code";
      document.getElementById("save-offer-btn").textContent = "Update Offer";
      document.getElementById("cancel-offer-edit").style.display = "inline-block";
    }

    function resetOfferForm() {
      document.getElementById("offer-edit-index").value = -1;
      document.getElementById("offer-form-title").textContent = "Create New Promo Code";
      document.getElementById("save-offer-btn").textContent = "Save Offer";
      document.getElementById("cancel-offer-edit").style.display = "none";
      document.getElementById("manage-offer-form").reset();
    }

    function removeOffer(index) {
      if (!confirm(`Delete promo code "${offers[index].code}"?`)) return;
      offers.splice(index, 1);
      localStorage.setItem("scentora_offers", JSON.stringify(offers));
      renderOfferCards();
    }

    document.getElementById("cancel-offer-edit").addEventListener("click", resetOfferForm);

    document.getElementById("manage-offer-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = document.getElementById("manage-offer-code").value.trim().toUpperCase();
      const discount = Number(document.getElementById("manage-offer-discount").value);
      const desc = document.getElementById("manage-offer-desc").value.trim();
      const editIndex = Number(document.getElementById("offer-edit-index").value);

      if (editIndex === -1) {
        offers.push({ code, discount, desc });
      } else {
        offers[editIndex] = { code, discount, desc };
        resetOfferForm();
      }

      localStorage.setItem("scentora_offers", JSON.stringify(offers));
      e.target.reset();
      renderOfferCards();
    });

    renderOfferCards();
  </script>
</body>
</html>
