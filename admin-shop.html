<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Catalog | Scentora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/shop.css">
    <style>
        /* =========================================
           BRAND LOGO & NAVBAR THEME OVERRIDES
        ========================================= */
        .navbar {
            min-height: 88px;
            padding: 15px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            background: rgba(250, 247, 240, 0.96);
            border-bottom: 1px solid #E8DED1;
            position: relative;
            z-index: 10;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            text-decoration: none;
        }

        .brand-logo {
            width: 43px;
            height: 43px;
            color: #854B2C;
            display: block;
            transition: transform 0.5s ease;
        }

        .brand:hover .brand-logo {
            transform: rotate(-12deg);
        }

        .brand-name {
            color: #49352A;
            font-family: "Playfair Display", serif;
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -1.3px;
            line-height: 1;
        }

        .brand-name > span {
            color: #AD8754;
        }

        /* High-Contrast Popping ADMIN Badge */
        .admin-badge-pill {
            display: inline-flex;
            align-items: center;
            background-color: #302219;
            color: #FAF7F0;
            border: 1.5px solid #AD8754;
            font-family: "DM Sans", sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 4px 11px;
            border-radius: 50px;
            margin-left: 6px;
            box-shadow: 0 4px 12px rgba(48, 34, 25, 0.22);
        }

        .navbar nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 29px;
        }

        .navbar nav a {
            color: #897C70;
            font-family: "DM Sans", sans-serif;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
        }

        .navbar nav a::after {
            content: "";
            position: absolute;
            bottom: -7px;
            left: 0;
            width: 0;
            height: 1px;
            background: #AD8754;
            transition: width 0.3s ease;
        }

        .navbar nav a:hover::after,
        .navbar nav a.active::after {
            width: 100%;
        }

        .navbar nav a:hover,
        .navbar nav a.active {
            color: #AD8754;
        }

        /* Admin-specific additions matching theme palette */
        .admin-nav-btns {
            display: flex;
            gap: 12px;
            align-items: center;
            white-space: nowrap;
        }

        .secondary-nav-btn {
            background-color: transparent;
            color: #49352A;
            border: 1px solid #C9B49A;
            padding: 11px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-family: "DM Sans", sans-serif;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .secondary-nav-btn:hover {
            background-color: #E9DDCB;
            border-color: #AD8754;
        }

        .navbar .cart-button {
            background: #49352A;
            color: #FFFFFF;
            padding: 12px 22px;
            border-radius: 50px;
            font-family: "DM Sans", sans-serif;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #49352A;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .navbar .cart-button:hover {
            background: #AD8754;
            border-color: #AD8754;
            transform: translateY(-2px);
        }

        .products-section {
            padding-top: 55px;
        }

        .delete-card-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background-color: rgba(255, 253, 249, 0.95);
            color: #a44e42;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .delete-card-btn:hover {
            background-color: #a44e42;
            color: white;
            transform: scale(1.08);
        }

        /* Edit / Add Modal */
        .edit-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(40, 28, 20, 0.55);
            z-index: 300;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .edit-modal-overlay.show {
            display: flex;
        }

        .edit-modal {
            background-color: #faf7f1;
            width: 100%;
            max-width: 460px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.22);
        }

        .edit-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ddcbb5;
        }

        .edit-modal-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #49372c;
        }

        .edit-modal form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .edit-modal label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #75563f;
            margin-bottom: 4px;
        }

        .edit-modal input,
        .edit-modal select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddcbb5;
            border-radius: 10px;
            background-color: white;
            color: #49372c;
            font-size: 14px;
            outline: none;
        }

        .edit-modal input:focus,
        .edit-modal select:focus {
            border-color: #a17b58;
        }

        .modal-grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-btn-row button {
            flex: 1;
            padding: 13px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-cancel {
            background-color: #e9ddcd;
            color: #49372c;
        }

        .btn-save {
            background-color: #75563f;
            color: white;
        }

        .btn-save:hover {
            background-color: #a17b58;
        }

        /* Footer Brand Styling */
        footer {
            background: #302219;
            color: #FAF7F0;
            padding: 55px 8% 25px;
            text-align: center;
        }

        .footer-brand {
            justify-content: center;
            margin-bottom: 15px;
        }

        .footer-brand .brand-logo,
        .footer-brand .brand-name {
            color: #FAF7F0;
        }

        footer .footer-tagline {
            color: #C9BBAA;
            font-size: 12px;
            margin-bottom: 22px;
        }

        footer .copyright {
            border-top: 1px solid #655448;
            padding-top: 22px;
            color: #B9AA99;
            font-size: 10px;
        }

        @media (max-width: 850px) {
            .navbar {
                flex-wrap: wrap;
                padding: 15px 5%;
            }

            .navbar nav {
                order: 3;
                width: 100%;
                padding: 10px 0 5px;
                flex-wrap: wrap;
                gap: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Security Check -->
    <script>
        if (sessionStorage.getItem("scentoraAdminLoggedIn") !== "true") {
            window.location.href = "admin-login.html";
        }
    </script>

    <!-- Navigation -->
    <header class="navbar">
        <a href="admin-shop.html" class="brand">
            <svg class="brand-logo" viewBox="0 0 100 100"
                 fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round">

                    <path d="M67 23C57 12 38 15 32 28C26 41 39 48 52 50C67 52 76 62 68 76C60 90 39 88 30 76"/>

                    <g transform="translate(39 20)">
                        <ellipse cy="-8" rx="4.5" ry="7"/>
                        <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(72)"/>
                        <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(144)"/>
                        <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(216)"/>
                        <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(288)"/>
                        <circle r="2.3" fill="#AD8754" stroke="none"/>
                    </g>

                    <g transform="translate(69 77)">
                        <ellipse cy="-7" rx="4" ry="6"/>
                        <ellipse cy="-7" rx="4" ry="6" transform="rotate(72)"/>
                        <ellipse cy="-7" rx="4" ry="6" transform="rotate(144)"/>
                        <ellipse cy="-7" rx="4" ry="6" transform="rotate(216)"/>
                        <ellipse cy="-7" rx="4" ry="6" transform="rotate(288)"/>
                        <circle r="2" fill="#AD8754" stroke="none"/>
                    </g>

                </g>
            </svg>

            <span class="brand-name">scentora<span>.</span></span>
            <span class="admin-badge-pill">ADMIN</span>
        </a>

        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="#products" class="active">Catalog</a>
            <a href="shops.html" target="_blank">Preview User Shop</a>
        </nav>

        <div class="admin-nav-btns">
            <button type="button" class="secondary-nav-btn" id="resetDefaultBtn">Reset Default 8</button>
            <button type="button" class="cart-button" id="addFragranceBtn">+ Add Fragrance</button>
        </div>
    </header>

    <!-- Products Section -->
    <main class="products-section" id="products">

        <div class="section-heading">
            <p class="subtitle">MANAGE COLLECTION</p>
            <h2>Click to Edit Any Scent</h2>
        </div>

        <!-- Search -->
        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                placeholder="Search fragrances to edit..."
            >
        </div>

        <!-- Filters -->
        <div class="filters">

            <div class="categories">
                <button type="button" class="category-btn active" data-category="All">All</button>
                <button type="button" class="category-btn" data-category="Men">Men</button>
                <button type="button" class="category-btn" data-category="Women">Women</button>
                <button type="button" class="category-btn" data-category="Unisex">Unisex</button>
                <button type="button" class="category-btn" data-category="Offers">Offers</button>
            </div>

            <select id="sortSelect">
                <option value="default">Sort By</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
            </select>

        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid">
            <!-- Generated via js/admin-shop.js -->
        </div>

        <p id="noProducts" class="no-products" hidden>
            No perfumes found. Try another search.
        </p>

    </main>

    <!-- Edit / Add Fragrance Modal -->
    <div class="edit-modal-overlay" id="editModalOverlay">
        <div class="edit-modal">
            <div class="edit-modal-header">
                <h2 id="modalHeading">Edit Fragrance</h2>
                <button type="button" class="close-btn" id="closeEditModal">✕</button>
            </div>

            <form id="adminShopForm">
                <input type="hidden" id="editProductId">

                <div>
                    <label for="editName">Perfume Name</label>
                    <input type="text" id="editName" placeholder="e.g. Vanilla Dream" required>
                </div>

                <div class="modal-grid-row">
                    <div>
                        <label for="editCategory">Category</label>
                        <select id="editCategory" required>
                            <option value="Women">Women</option>
                            <option value="Men">Men</option>
                            <option value="Unisex">Unisex</option>
                        </select>
                    </div>

                    <div>
                        <label for="editPrice">Price (EGP)</label>
                        <input type="number" id="editPrice" min="1" required>
                    </div>
                </div>

                <div class="modal-grid-row">
                    <div>
                        <label for="editOldPrice">Old Price (Optional)</label>
                        <input type="number" id="editOldPrice" min="0" placeholder="0">
                    </div>

                    <div>
                        <label for="editImage">Image URL</label>
                        <input type="url" id="editImage" placeholder="https://...">
                    </div>
                </div>

                <div class="modal-btn-row">
                    <button type="button" class="btn-cancel" id="cancelEditModal">Cancel</button>
                    <button type="submit" class="btn-save">Save & Sync to Shop</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <a href="admin-shop.html" class="brand footer-brand">
            <svg class="brand-logo" viewBox="0 0 100 100"
                 fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round">

                    <path d="M67 23C57 12 38 15 32 28C26 41 39 48 52 50C67 52 76 62 68 76C60 90 39 88 30 76"/>

                    <g transform="translate(39 20)">
                        <ellipse cy="-8" rx="4.5" ry="7"/>
                        <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(72)"/>
                        <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(144)"/>
                        <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(216)"/>
                        <ellipse cy="-8" rx="4.5" ry="7" transform="rotate(288)"/>
                        <circle r="2.3" fill="#AD8754" stroke="none"/>
                    </g>

                    <g transform="translate(69 77)">
                        <ellipse cy="-7" rx="4" ry="6"/>
                        <ellipse cy="-7" rx="4" ry="6" transform="rotate(72)"/>
                        <ellipse cy="-7" rx="4" ry="6" transform="rotate(144)"/>
                        <ellipse cy="-7" rx="4" ry="6" transform="rotate(216)"/>
                        <ellipse cy="-7" rx="4" ry="6" transform="rotate(288)"/>
                        <circle r="2" fill="#AD8754" stroke="none"/>
                    </g>

                </g>
            </svg>

            <span class="brand-name">scentora<span>.</span></span>
        </a>
        <p class="footer-tagline">Luxury is a fragrance you never forget.</p>
        <p class="copyright">© 2026 Scentora. All rights reserved.</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/admin-shop.js"></script>

</body>
</html>
