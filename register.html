<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Scentora</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <div class="background-overlay"></div>

    <header class="top-header">
        <a href="index.html" class="brand">
            <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
                <path d="M32 53 C17 45 12 31 17 17 C29 19 37 28 32 53Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M32 53 C47 45 52 31 47 17 C35 19 27 28 32 53Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M32 53 L32 13" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M22 37 L32 45 L42 37" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>

            <span class="brand-text">
                <strong>scentora<span>.</span></strong>
                <small>THE ART OF FRAGRANCE</small>
            </span>
        </a>

        <p class="header-tagline">Craft your signature scent <span></span></p>
    </header>

    <main class="login-main">

        <div class="petal petal-one">✧</div>
        <div class="petal petal-two">✦</div>
        <div class="petal petal-three">✧</div>
        <div class="petal petal-four">✦</div>

        <section class="login-card">

            <div class="card-logo">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M32 53 C17 45 12 31 17 17 C29 19 37 28 32 53Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M32 53 C47 45 52 31 47 17 C35 19 27 28 32 53Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M32 53 L32 13" fill="none" stroke="currentColor" stroke-width="1.8"/>
                </svg>
            </div>

            <h1>Create Account</h1>
            <p class="card-subtitle">Enter your details to begin shopping</p>

            <form id="registerForm" novalidate>

                <div class="input-field">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c1.8-4 14.2-4 16 0"/>
                        </svg>
                    </span>
                    <input type="text" id="regName" placeholder="Full Name" autocomplete="name" required>
                </div>

                <div class="input-field">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3.5" y="5" width="17" height="14" rx="2"/>
                            <path d="M4 7L12 13L20 7"/>
                        </svg>
                    </span>
                    <input type="email" id="regEmail" placeholder="Email Address" autocomplete="email" required>
                </div>

                <div class="input-field password-field">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            <circle cx="12" cy="15" r="1.2"/>
                            <path d="M12 16.2V18"/>
                        </svg>
                    </span>
                    <input type="password" id="regPassword" placeholder="Create Password" autocomplete="new-password" required>
                </div>

                <div class="input-field password-field">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            <path d="M9 15l2 2 4-4"/>
                        </svg>
                    </span>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="login-button" id="registerButton">
                    <span>Create Account</span>
                    <span class="arrow">→</span>
                </button>

                <p class="login-message" id="registerMessage" aria-live="polite"></p>

            </form>

            <p class="signup-text">
                Already have an account?
                <a href="login.html">Log In</a>
            </p>

        </section>
    </main>

    <footer class="page-footer">
        <span>SCENTORA</span> &nbsp;·&nbsp; YOUR SIGNATURE, YOUR STORY
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
